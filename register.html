<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

</head>

<body>

<header>
<h1>E-Book Management System</h1>
</header>

<section class="hero">

<h2>Create Account</h2>

<input type="text" id="newUsername" placeholder="Enter Username"><br><br>

<input type="email" id="newEmail" placeholder="Enter Email"><br><br>

<input type="password" id="newPassword" placeholder="Enter Password"><br><br>
<button onclick="sendOTP()">Send OTP</button><br><br>

<input type="text" id="otp" placeholder="Enter 6-digit OTP"><br><br>

<button onclick="register()">Verify OTP & Register</button>

<a href="login.html">Login</a></p>

</section>
